name: Cross-platform checks

on:
  push:
  pull_request:

jobs:
  runtime-tests:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install numpy requests soundfile
      - name: Compile Python sources
        run: >-
          python -m py_compile
          botQwen2.py
          botqwen_runtime.py
          sfx_app.py
          sfx_runtime.py
          scene_sfx.py
          verify_runtime.py
          tests/test_botqwen_runtime.py
          tests/test_sfx_runtime.py
          tests/test_scene_sfx.py
      - name: Run runtime tests
        run: python -m unittest discover -s tests -v
